name: VPN Gate Node Check

# ★ 定时刷新由【NAS 侧】驱动，本工作流只保留 workflow_dispatch 作为唯一入口。
#
# 为什么不用 GitHub 原生 schedule:
#   ① schedule 是 best-effort 共享基础设施 —— 实测延迟 17 分钟起(UTC 01:07 的窗口 01:24 才跑),
#      高负载时还会整批丢弃;公开仓连续 60 天无提交会被自动停用。
#   ② 原生 cron 触发的 run 没有重试,撞上 Pages 的 artifact 元数据竞态就静默失败
#      (实测 2026-11-28T01:24:45Z 那次 schedule run 就是 failure,产物没更新)。
#   ③ 与 NAS 侧并存在同一个仓会重复消耗检测配额,还互相污染 run 历史。
#   NAS 侧调度(Hermes cron ca5216509456,'7 */6 * * *', Asia/Shanghai)会调
#   POST /repos/teddy4556/gate/actions/workflows/check.yml/dispatches(ref=main),
#   自带失败重试 3 轮 + 产物核对 + 静默告警,是唯一的主时钟。
#
on:
  workflow_dispatch:
    inputs:
      max_nodes:
        description: '最多检测多少个节点（0 = 全部）'
        required: false
        default: '0'
      concurrency:
        description: '并发数（建议 16–32）'
        required: false
        default: '32'
      timeout:
        description: '单节点检测超时（秒）'
        required: false
        default: '25'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate worker secret
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          if [ -z "${DOMAIN}" ]; then
            echo "::error::未配置检测地址。请在仓库 Settings → Secrets and variables → Actions 中新增 Secret：DOMAIN（只填 Worker 的 host，例如 abc.workers.dev）"
            exit 1
          fi
          echo "检测域名已配置：${DOMAIN}"

      - name: Run pipeline
        env:
          CHECK_WORKER: "https://${{ secrets.DOMAIN }}/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: ${{ github.event.inputs.concurrency || '32' }}
          CHECK_TIMEOUT: ${{ github.event.inputs.timeout || '25' }}
          MAX_CHECK_NODES: ${{ github.event.inputs.max_nodes || '0' }}
          MIN_SUCCESS_RATIO: '0'
        run: python vpngate.py

      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" "${api}")
          echo "GET ${api} -> ${status}"

          if [ "${status}" = "200" ]; then
            echo "GitHub Pages 已启用"
            exit 0
          fi

          if [ "${status}" = "404" ]; then
            # 创建站点必须用 POST，且 workflow 构建类型不接受 source 字段
            create=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' -X POST \
              "${auth[@]}" -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' "${api}")
            echo "POST ${api} -> ${create}"
            case "${create}" in
              201|204|409)
                echo "GitHub Pages 已启用（或已存在），等待生效"
                sleep 10
                exit 0
                ;;
              *)
                echo "::error::自动启用 Pages 失败（HTTP ${create}）。请打开仓库 Settings → Pages，把 Source 选为 GitHub Actions，然后重新运行本工作流。"
                cat /tmp/pages-create.json 2>/dev/null || true
                exit 1
                ;;
            esac
          fi

          echo "::error::查询 Pages 状态失败（HTTP ${status}），请检查仓库 Pages 设置或工作流权限。"
          cat /tmp/pages.json 2>/dev/null || true
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Show site URL
        run: |
          echo "订阅地址：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt"
          echo "仪表盘：  https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"